services:
  - type: web
    name: stockledger
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev --prefix web && npm ci --include=dev --prefix server && npm run build --prefix web && npm run build --prefix server
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_JWT_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_NAME
        value: Platform Administrator
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PGPOOL
        value: "5"
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: stockledger-db
    databaseName: stockledger
    user: app_user
    region: oregon
    plan: free